---
- name: Deploy AAP Hub Resources from Infrastructure as Code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ah_host: "{{ new_aap_gateway_url }}"
    ah_token: "{{ my_aap_token }}"
    validate_certs_flag: "{{ validate_certs | default(false) }}"
    git_repo_url: "https://github.com/NAOwens/aap-iac.git"
    git_clone_dest: "/tmp/aap-hub-iac"
    iac_source_dir: "{{ git_clone_dest }}/iac-hub-exports"

  pre_tasks:
    - name: Validate required extra_vars
      ansible.builtin.assert:
        that:
          - new_aap_gateway_url is defined and new_aap_gateway_url != ''
          - my_aap_token is defined and my_aap_token != ''
        fail_msg: "new_aap_gateway_url and my_aap_token must be provided via Extra Vars"

    - name: Clone IaC Hub repository from GitHub
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_clone_dest }}"
        version: main
        force: true

    - name: Verify IaC Hub source directory exists
      ansible.builtin.stat:
        path: "{{ iac_source_dir }}"
      register: iac_dir
      failed_when: not iac_dir.stat.exists

  tasks:
    # ---------------------------------------------------------
    # 1. NAMESPACES
    # ---------------------------------------------------------
    - name: Load namespace definitions
      ansible.builtin.set_fact:
        namespaces: "{{ lookup('file', iac_source_dir ~ '/namespaces/namespaces.yml', errors='ignore') | default('[]', true) | from_yaml }}"

    - name: Create or update Namespaces via API
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/v3/namespaces/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          company: "{{ item.company | default('') }}"
          description: "{{ item.description | default('') }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [200, 201, 409]
      loop: "{{ namespaces }}"
      loop_control:
        label: "{{ item.name }}"
      register: namespace_deploy

    # ---------------------------------------------------------
    # 2. EXECUTION ENVIRONMENT REPOSITORIES
    # Three steps: create the Pulp container repository, look up
    # its href by name (building a name-keyed map to avoid fragile
    # index alignment), then create the Galaxy distribution.
    # ---------------------------------------------------------
    - name: Load Execution Environment definitions
      ansible.builtin.set_fact:
        ee_repos: "{{ lookup('file', iac_source_dir ~ '/execution_environments/execution_environments.yml', errors='ignore') | default('[]', true) | from_yaml }}"

    - name: Create EE Repository (Pulp API)
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/pulp/api/v3/repositories/container/container/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [201, 409]
      loop: "{{ ee_repos }}"
      loop_control:
        label: "{{ item.name }}"
      register: pulp_repo

    - name: Get EE Repository HREFs by name
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/pulp/api/v3/repositories/container/container/?name={{ item.name | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ ah_token }}"
        validate_certs: "{{ validate_certs_flag }}"
      loop: "{{ ee_repos }}"
      loop_control:
        label: "{{ item.name }}"
      register: repo_href_results

    - name: Build EE HREF lookup map
      # Builds {name: pulp_href} so the distribution step can look up
      # HREFs by name rather than by loop index — avoids misalignment
      # if any item produces a failed or skipped result.
      ansible.builtin.set_fact:
        ee_href_map: >-
          {{
            ee_href_map | default({}) | combine({
              item.item.name: item.json.results[0].pulp_href | default('')
            })
          }}
      loop: "{{ repo_href_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.json.results | default([]) | length > 0

    - name: Create EE Distribution (Pulp API)
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/pulp/api/v3/distributions/container/container/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          base_path: "{{ item.name }}"
          repository: "{{ ee_href_map[item.name] }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [201, 409]
      loop: "{{ ee_repos }}"
      loop_control:
        label: "{{ item.name }}"
      register: ee_deploy
      when:
        - ee_href_map is defined
        - item.name in ee_href_map
        - ee_href_map[item.name] != ''

    # ---------------------------------------------------------
    # 3. REMOTE REGISTRIES (Collection Remotes)
    # ---------------------------------------------------------
    - name: Load Remote Registry definitions
      ansible.builtin.set_fact:
        remotes: "{{ lookup('file', iac_source_dir ~ '/remotes/remotes.yml', errors='ignore') | default('[]', true) | from_yaml }}"

    - name: Create or update Remote Registries via API
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/pulp/api/v3/remotes/ansible/collection/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          url: "{{ item.url }}"
          requirements_file: "{{ item.requirements_file | default(omit, true) }}"
          auth_url: "{{ item.auth_url | default(omit, true) }}"
          ca_cert: "{{ item.ca_cert | default(omit, true) }}"
          client_cert: "{{ item.client_cert | default(omit, true) }}"
          client_key: "{{ item.client_key | default(omit, true) }}"
          proxy_url: "{{ item.proxy_url | default(omit, true) }}"
          proxy_username: "{{ item.proxy_username | default(omit, true) }}"
          proxy_password: "{{ item.proxy_password | default(omit, true) }}"
          tls_validation: "{{ omit if item.tls_validation is none else item.tls_validation }}"
          rate_limit: "{{ omit if item.rate_limit is none else item.rate_limit }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [201, 409]
      loop: "{{ remotes }}"
      loop_control:
        label: "{{ item.name }}"
      register: remote_deploy

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          AAP Hub Deployment Complete — {{ ah_host }}

          Deployed (successful/total):
            - Namespaces:             {{ namespace_deploy.results | rejectattr('failed') | list | length }}/{{ namespace_deploy.results | length }}
            - EE Repositories:        {{ pulp_repo.results | rejectattr('failed') | list | length }}/{{ pulp_repo.results | length }}
            - EE Distributions:       {{ ee_deploy.results | rejectattr('failed') | rejectattr('skipped') | list | length }}/{{ ee_repos | length }}
            - Collection Remotes:     {{ remote_deploy.results | rejectattr('failed') | list | length }}/{{ remote_deploy.results | length }}

          NOTE: EE container images must be pushed to Hub separately.
          Deploy deploy_aap_resources.yml after this playbook to create
          the matching Controller-side EE references.
