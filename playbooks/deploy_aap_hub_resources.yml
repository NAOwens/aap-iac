---
- name: Deploy AAP Hub Resources from Infrastructure as Code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Variables passed via Extra Vars at launch
    ah_host: "{{ new_aap_gateway_url }}"
    ah_token: "{{ my_aap_token }}"
    validate_certs_flag: "{{ validate_certs | default(false) }}"
    
    # GitHub Repository Settings
    git_repo_url: "https://github.com/NAOwens/aap-iac.git"
    git_clone_dest: "/tmp/aap-hub-iac"
    
    # Source directory pointing to the cloned repo
    iac_source_dir: "{{ git_clone_dest }}/iac-hub-exports"

  pre_tasks:
    - name: Validate required extra_vars
      ansible.builtin.assert:
        that:
          - ah_host is defined and ah_host != ''
          - ah_token is defined and ah_token != ''
        fail_msg: "Both 'new_aap_gateway_url' and 'my_aap_token' extra_vars must be set!"

    - name: Clone IaC Hub repository from GitHub
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_clone_dest }}"
        version: "main"
        force: true
        
    - name: Check IaC Hub source directory exists in cloned repo
      ansible.builtin.stat:
        path: "{{ iac_source_dir }}"
      register: iac_dir
      failed_when: not iac_dir.stat.exists

  tasks:
    # ---------------------------------------------------------
    # NAMESPACES
    # ---------------------------------------------------------
    - name: Load namespace definitions
      ansible.builtin.set_fact:
        namespaces: "{{ lookup('file', iac_source_dir ~ '/namespaces/namespaces.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update Namespaces via API
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/v3/namespaces/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          company: "{{ item.company | default('') }}"
          description: "{{ item.description | default('') }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [200, 201, 400, 409] # Accepts success, created, or already exists
      loop: "{{ namespaces | default([]) }}"
      register: namespace_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # EXECUTION ENVIRONMENTS
    # ---------------------------------------------------------
    - name: Load Execution Environment definitions
      ansible.builtin.set_fact:
        ee_repos: "{{ lookup('file', iac_source_dir ~ '/execution_environments/execution_environments.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create Execution Environment Repositories via API
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/v3/plugin/execution-environments/repositories/"
        method: POST
        headers:
          Authorization: "Bearer {{ ah_token }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
        validate_certs: "{{ validate_certs_flag }}"
        status_code: [200, 201, 400, 409] # Accepts success, created, or already exists
      loop: "{{ ee_repos | default([]) }}"
      register: ee_deploy
      ignore_errors: true

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Hub Deployment Summary:
          - Namespaces processed: {{ namespace_deploy.results | length if namespace_deploy.results is defined else 0 }}
          - Execution Environments processed: {{ ee_deploy.results | length if ee_deploy.results is defined else 0 }}