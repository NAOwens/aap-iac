---
- name: Pull AAP Hub Resources and Store as Infrastructure as Code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ah_host: "{{ survey_ah_host }}"
    ah_token: "{{ AH_TOKEN }}"
    ah_validate_certs: "{{ validate_certs | default(false) }}"
    iac_output_dir: "./iac-hub-exports"
    git_token_variable: "{{ github_token }}"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ah_host is defined and ah_host != ''
          - ah_token is defined and ah_token != ''
          - git_token_variable is defined and git_token_variable != ''
        fail_msg: "survey_ah_host, AH_TOKEN, and github_token must all be provided"

    - name: Create output directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ iac_output_dir }}"
        - "{{ iac_output_dir }}/namespaces"
        - "{{ iac_output_dir }}/execution_environments"
        - "{{ iac_output_dir }}/remotes"

  tasks:
    # ---------------------------------------------------------
    # NAMESPACES
    # ---------------------------------------------------------
    - name: Pull namespaces from Automation Hub
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/v3/namespaces/"
        method: GET
        headers:
          Authorization: "Token {{ ah_token }}"
        validate_certs: "{{ ah_validate_certs }}"
        return_content: true
      register: namespaces_api

    - name: Export namespaces to YAML
      ansible.builtin.copy:
        content: "{{ namespaces_api.json.data | default(namespaces_api.json.results | default([])) | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/namespaces/namespaces.yml"

    # ---------------------------------------------------------
    # EXECUTION ENVIRONMENTS
    # ---------------------------------------------------------
    - name: Pull Execution Environments from Automation Hub
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/v3/plugin/execution-environments/repositories/"
        method: GET
        headers:
          Authorization: "Token {{ ah_token }}"
        validate_certs: "{{ ah_validate_certs }}"
        return_content: true
      register: ee_api

    - name: Export Execution Environments to YAML
      ansible.builtin.copy:
        content: "{{ ee_api.json.data | default(ee_api.json.results | default([])) | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/execution_environments/execution_environments.yml"

    # ---------------------------------------------------------
    # REMOTES (Remote Collection Registries)
    # ---------------------------------------------------------
    - name: Pull Collection Remotes from Automation Hub
      ansible.builtin.uri:
        url: "{{ ah_host }}/api/galaxy/_ui/v1/remotes/"
        method: GET
        headers:
          Authorization: "Token {{ ah_token }}"
        validate_certs: "{{ ah_validate_certs }}"
        return_content: true
      register: remotes_api

    - name: Export Remotes to YAML
      ansible.builtin.copy:
        content: "{{ remotes_api.json.data | default(remotes_api.json.results | default([])) | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/remotes/remotes.yml"

  post_tasks:
    - name: Create summary report
      ansible.builtin.copy:
        content: |
          # AAP Hub Resource Export Summary
          Generated: {{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
          Hub Host: {{ ah_host }}

          ## Exported Resources
          - Namespaces: {{ namespaces_api.json.data | default(namespaces_api.json.results | default([])) | length }}
          - Execution Environments: {{ ee_api.json.data | default(ee_api.json.results | default([])) | length }}
          - Remotes: {{ remotes_api.json.data | default(remotes_api.json.results | default([])) | length }}

          ## Location
          Export directory: {{ iac_output_dir }}
        dest: "{{ iac_output_dir }}/EXPORT_SUMMARY.md"

    - name: Clone the CaC repository
      ansible.builtin.git:
        repo: "https://{{ git_token_variable }}@github.com/NAOwens/aap-iac.git"
        dest: /tmp/cac_hub_repo
        version: main
        accept_hostkey: true
      no_log: true

    - name: Copy exported Hub files to the git repository
      ansible.builtin.copy:
        src: "{{ iac_output_dir }}/"
        dest: /tmp/cac_hub_repo/iac-hub-exports/
        remote_src: true

    - name: Check for changed files
      ansible.builtin.command: git status --porcelain
      args:
        chdir: /tmp/cac_hub_repo
      register: git_status
      changed_when: false

    - name: Commit and push exported files to GitHub
      ansible.builtin.shell: |
        git config user.email "owensna7@gmail.com"
        git config user.name "NAOwens"
        git remote set-url origin https://NAOwens:{{ git_token_variable }}@github.com/NAOwens/aap-iac.git
        git add .
        git commit -m "Automated AAP Hub resource export"
        git push origin main
      args:
        chdir: /tmp/cac_hub_repo
      environment:
        GIT_TERMINAL_PROMPT: "0"
      when: git_status.stdout | length > 0
      no_log: true

    - name: Display export summary
      ansible.builtin.debug:
        msg: "Hub resources exported to {{ iac_output_dir }} — {{ 'committed and pushed to GitHub' if git_status.stdout | length > 0 else 'no changes detected, nothing pushed' }}"
