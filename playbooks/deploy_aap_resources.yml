---
- name: Deploy AAP Resources from Infrastructure as Code
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Gateway URL based on your successful curl test
    aap_host: "{{ new_aap_gateway_url }}"
    
    # Renamed variable to avoid built-in alias collisions
    my_auth_token: "{{ my_aap_token }}"
    validate_certs_flag: "{{ validate_certs | default(false) }}"
    
    # GitHub Repository Settings
    git_repo_url: "https://github.com/NAOwens/aap-iac.git"
    git_clone_dest: "/tmp/aap-iac"
    
    # Source directory pointing to the cloned repo
    iac_source_dir: "{{ git_clone_dest }}/iac-exports"

  collections:
    - awx.awx
    - ansible.controller
    - ansible.platform

  pre_tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - my_auth_token is defined and my_auth_token != ''
        fail_msg: "AAP_TOKEN variable must be set via Extra Vars or a Custom Credential"

    - name: Clone IaC repository from GitHub
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_clone_dest }}"
        version: "main"
        force: true
        
    - name: Check IaC source directory exists in cloned repo
      ansible.builtin.stat:
        path: "{{ iac_source_dir }}"
      register: iac_dir
      failed_when: not iac_dir.stat.exists

  tasks:
    # ---------------------------------------------------------
    # ORGANIZATIONS (Gateway RBAC - ansible.platform)
    # ---------------------------------------------------------
    - name: Load organization definitions
      ansible.builtin.set_fact:
        organizations: "{{ lookup('file', iac_source_dir ~ '/organizations/organizations.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update organizations
      ansible.platform.organization:
        aap_hostname: "{{ aap_host }}"
        aap_token: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ organizations | default([]) }}"
      register: org_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # USERS (Gateway RBAC - ansible.platform)
    # ---------------------------------------------------------
    - name: Load user definitions
      ansible.builtin.set_fact:
        users: "{{ lookup('file', iac_source_dir ~ '/users/users.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update users
      ansible.platform.user:
        aap_hostname: "{{ aap_host }}"
        aap_token: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        username: "{{ item.username }}"
        email: "{{ item.email | default(omit) }}"
        first_name: "{{ item.first_name | default(omit) }}"
        last_name: "{{ item.last_name | default(omit) }}"
      loop: "{{ users | default([]) }}"
      register: user_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # TEAMS (Gateway RBAC - ansible.platform)
    # ---------------------------------------------------------
    - name: Load team definitions
      ansible.builtin.set_fact:
        teams: "{{ lookup('file', iac_source_dir ~ '/teams/teams.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update teams
      ansible.platform.team:
        aap_hostname: "{{ aap_host }}"
        aap_token: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ teams | default([]) }}"
      register: team_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # PROJECTS (Controller Execution - ansible.controller)
    # ---------------------------------------------------------
    - name: Load project definitions
      ansible.builtin.set_fact:
        projects: "{{ lookup('file', iac_source_dir ~ '/projects/projects.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update projects
      ansible.controller.project:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization | default(omit) }}"
        scm_type: "{{ item.scm_type | default('') }}"
        scm_url: "{{ item.scm_url | default('') }}"
        scm_branch: "{{ item.scm_branch | default('main') }}"
      loop: "{{ projects | default([]) }}"
      register: project_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # INVENTORIES (Controller Execution - ansible.controller)
    # ---------------------------------------------------------
    - name: Load inventory definitions
      ansible.builtin.set_fact:
        inventories: "{{ lookup('file', iac_source_dir ~ '/inventories/inventories.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update inventories
      ansible.controller.inventory:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ inventories | default([]) }}"
      register: inventory_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # INVENTORY SOURCES
    # ---------------------------------------------------------
    - name: Load inventory source definitions
      ansible.builtin.set_fact:
        inventory_sources: "{{ lookup('file', iac_source_dir ~ '/inventories/inventory_sources.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update inventory sources
      ansible.controller.inventory_source:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        source: "{{ item.source }}"
        source_path: "{{ item.source_path | default(omit) }}"
        credential: "{{ item.credential | default(omit) }}"
        update_on_launch: "{{ item.update_on_launch | default(omit) }}"
      loop: "{{ inventory_sources | default([]) }}"
      register: inv_source_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # STATIC HOSTS
    # ---------------------------------------------------------
    - name: Load host definitions
      ansible.builtin.set_fact:
        hosts: "{{ lookup('file', iac_source_dir ~ '/inventories/hosts.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update hosts
      ansible.controller.host:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        description: "{{ item.description | default(omit) }}"
        variables: "{{ omit if item.variables == '---' or not item.variables else item.variables }}"
      loop: "{{ hosts | default([]) }}"
      register: host_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # EXECUTION ENVIRONMENTS (Controller)
    # ---------------------------------------------------------
    - name: Create or update Controller Execution Environments
      ansible.controller.execution_environment:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_aap_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "Private Hub EE Supported"
        image: "rhel92.ofam.dev/ee-supported-rhel8:latest"
        pull: "missing"
      ignore_errors: true

    # ---------------------------------------------------------
    # JOB TEMPLATES (Controller Execution - ansible.controller)
    # ---------------------------------------------------------
    - name: Load job template definitions
      ansible.builtin.set_fact:
        job_templates: "{{ lookup('file', iac_source_dir ~ '/job_templates/job_templates.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update job templates
      ansible.controller.job_template:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization | default(omit) }}"
        project: "{{ omit if not item.project else item.project }}"
        playbook: "{{ item.playbook | default(omit) }}"
        inventory: "{{ omit if not item.inventory else item.inventory }}"
        execution_environment: "{{ omit if not item.execution_environment else item.execution_environment }}"
        # FIX: Force prompt on launch if no default inventory is set
        ask_inventory_on_launch: "{{ true if not item.inventory else item.ask_inventory_on_launch | default(false) }}"
      loop: "{{ job_templates | default([]) }}"
      register: job_template_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # WORKFLOW TEMPLATES (Controller Execution - ansible.controller)
    # ---------------------------------------------------------
    - name: Load workflow template definitions
      ansible.builtin.set_fact:
        workflows: "{{ lookup('file', iac_source_dir ~ '/workflows/workflows.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update workflow templates
      ansible.controller.workflow_job_template:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
      loop: "{{ workflows | default([]) }}"
      register: workflow_deploy
      ignore_errors: true

    # ---------------------------------------------------------
    # NOTIFICATION TEMPLATES (Controller Execution - ansible.controller)
    # ---------------------------------------------------------
    - name: Load notification template definitions
      ansible.builtin.set_fact:
        notifications: "{{ lookup('file', iac_source_dir ~ '/notification_templates/notifications.yml', errors='ignore') | default('[]', true) | from_yaml }}"
      ignore_errors: true

    - name: Create or update notification templates
      ansible.controller.notification_template:
        controller_host: "{{ aap_host }}"
        controller_oauthtoken: "{{ my_auth_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        state: present
        name: "{{ item.name }}"
        notification_type: "{{ item.notification_type | default(omit) }}"
      loop: "{{ notifications | default([]) }}"
      register: notification_deploy
      ignore_errors: true

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Deployment Summary:
          - Organizations created/updated: {{ org_deploy.results | length if org_deploy.results is defined else 0 }}
          - Users created/updated: {{ user_deploy.results | length if user_deploy.results is defined else 0 }}
          - Teams created/updated: {{ team_deploy.results | length if team_deploy.results is defined else 0 }}
          - Projects created/updated: {{ project_deploy.results | length if project_deploy.results is defined else 0 }}
          - Inventories created/updated: {{ inventory_deploy.results | length if inventory_deploy.results is defined else 0 }}
          - Job Templates created/updated: {{ job_template_deploy.results | length if job_template_deploy.results is defined else 0 }}
          - Workflow Templates created/updated: {{ workflow_deploy.results | length if workflow_deploy.results is defined else 0 }}
          - Notification Templates created/updated: {{ notification_deploy.results | length if notification_deploy.results is defined else 0 }}