---
- name: Pull AAP Resources and Store as Infrastructure as Code
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    aap_controller_host: "{{ aap_controller_url | default('https://controller.example.com') }}"
    aap_controller_token: "{{ lookup('env', 'AAP_TOKEN') }}"
    aap_controller_validate_certs: "{{ validate_certs | default(true) }}"
    iac_output_dir: "./iac-exports"
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

  collections:
    - awx.awx
    - ansible.controller

  pre_tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - aap_controller_token is defined and aap_controller_token != ''
        fail_msg: "AAP_TOKEN environment variable must be set"

    - name: Create output directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ iac_output_dir }}"
        - "{{ iac_output_dir }}/organizations"
        - "{{ iac_output_dir }}/teams"
        - "{{ iac_output_dir }}/users"
        - "{{ iac_output_dir }}/credentials"
        - "{{ iac_output_dir }}/projects"
        - "{{ iac_output_dir }}/inventories"
        - "{{ iac_output_dir }}/job_templates"
        - "{{ iac_output_dir }}/workflows"
        - "{{ iac_output_dir }}/notification_templates"

  tasks:
    # Organizations
    - name: Pull organizations from AAP Controller
      set_fact:
        org_results: "{{ query('awx.awx.controller_api', 'organizations', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export organizations to YAML
      ansible.builtin.copy:
        content: "{{ org_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/organizations/organizations_{{ timestamp }}.yml"
      when: org_results is defined and org_results | length > 0

    # Users
    - name: Pull users from AAP Controller
      set_fact:
        user_results: "{{ query('awx.awx.controller_api', 'users', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export users to YAML
      ansible.builtin.copy:
        content: "{{ user_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/users/users_{{ timestamp }}.yml"
      when: user_results is defined and user_results | length > 0

    # Teams
    - name: Pull teams from AAP Controller
      set_fact:
        team_results: "{{ query('awx.awx.controller_api', 'teams', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export teams to YAML
      ansible.builtin.copy:
        content: "{{ team_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/teams/teams_{{ timestamp }}.yml"
      when: team_results is defined and team_results | length > 0

    # Credentials (without sensitive data)
    - name: Pull credentials metadata from AAP Controller
      set_fact:
        credentials_list: "{{ query('awx.awx.controller_api', 'credentials', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export credential metadata to YAML
      ansible.builtin.copy:
        content: |
          ---
          # Credentials (sensitive data excluded)
          # Re-create credentials with sensitive values in a secure manner
          {{ credentials_list | to_nice_yaml }}
        dest: "{{ iac_output_dir }}/credentials/credentials_metadata_{{ timestamp }}.yml"
      when: credentials_list is defined and credentials_list | length > 0

    # Projects
    - name: Pull projects from AAP Controller
      set_fact:
        project_results: "{{ query('awx.awx.controller_api', 'projects', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export projects to YAML
      ansible.builtin.copy:
        content: "{{ project_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/projects/projects_{{ timestamp }}.yml"
      when: project_results is defined and project_results | length > 0

    # Inventories
    - name: Pull inventories from AAP Controller
      set_fact:
        inventory_results: "{{ query('awx.awx.controller_api', 'inventories', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export inventories to YAML
      ansible.builtin.copy:
        content: "{{ inventory_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/inventories/inventories_{{ timestamp }}.yml"
      when: inventory_results is defined and inventory_results | length > 0

    # Job Templates
    - name: Pull job templates from AAP Controller
      set_fact:
        job_template_results: "{{ query('awx.awx.controller_api', 'job_templates', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export job templates to YAML
      ansible.builtin.copy:
        content: "{{ job_template_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/job_templates/job_templates_{{ timestamp }}.yml"
      when: job_template_results is defined and job_template_results | length > 0

    # Workflows
    - name: Pull workflow templates from AAP Controller
      set_fact:
        workflow_results: "{{ query('awx.awx.controller_api', 'workflow_templates', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export workflow templates to YAML
      ansible.builtin.copy:
        content: "{{ workflow_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/workflows/workflows_{{ timestamp }}.yml"
      when: workflow_results is defined and workflow_results | length > 0

    # Notification Templates
    - name: Pull notification templates from AAP Controller
      set_fact:
        notification_results: "{{ query('awx.awx.controller_api', 'notification_templates', host=aap_controller_host, oauth_token=aap_controller_token, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export notification templates to YAML
      ansible.builtin.copy:
        content: "{{ notification_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/notification_templates/notifications_{{ timestamp }}.yml"
      when: notification_results is defined and notification_results | length > 0

  post_tasks:
    - name: Create summary report
      ansible.builtin.copy:
        content: |
          # AAP Resource Export Summary
          Generated: {{ ansible_date_time.iso8601 }}
          Controller: {{ aap_controller_host }}
          
          ## Exported Resources
          - Organizations: {{ org_results | length | default(0) }}
          - Users: {{ user_results | length | default(0) }}
          - Teams: {{ team_results | length | default(0) }}
          - Credentials: {{ credentials_list | length | default(0) }}
          - Projects: {{ project_results | length | default(0) }}
          - Inventories: {{ inventory_results | length | default(0) }}
          - Job Templates: {{ job_template_results | length | default(0) }}
          - Workflow Templates: {{ workflow_results | length | default(0) }}
          - Notification Templates: {{ notification_results | length | default(0) }}
          
          ## Location
          Export directory: {{ iac_output_dir }}
          
          ## Notes
          - Sensitive credential data (passwords, API tokens) is not exported for security
          - Credentials must be re-created with sensitive values in a secure manner
          - Review and commit exported files to version control
        dest: "{{ iac_output_dir }}/EXPORT_SUMMARY_{{ timestamp }}.md"

    - name: Display export summary
      ansible.builtin.debug:
        msg: "AAP resources exported to {{ iac_output_dir }}"
