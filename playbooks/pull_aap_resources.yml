---
- name: Pull AAP Resources and Store as Infrastructure as Code
  hosts: localhost
  gather_facts: true
  vars:
    aap_controller_host: "{{ aap_controller_url | default('https://controller.example.com') }}"
    aap_controller_username: "{{ lookup('env', 'AAP_USERNAME') }}"
    aap_controller_password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    aap_controller_validate_certs: "{{ validate_certs | default(true) }}"
    iac_output_dir: "./iac-exports"
    timestamp: "{{ ansible_date_time.iso8601_basic_short }}"

  collections:
    - awx.awx
    - ansible.controller

  pre_tasks:
    - name: Validate required environment variables
      assert:
        that:
          - aap_controller_username is defined
          - aap_controller_password is defined
        fail_msg: "AAP_USERNAME and AAP_PASSWORD environment variables must be set"

    - name: Create output directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ iac_output_dir }}"
        - "{{ iac_output_dir }}/organizations"
        - "{{ iac_output_dir }}/teams"
        - "{{ iac_output_dir }}/users"
        - "{{ iac_output_dir }}/credentials"
        - "{{ iac_output_dir }}/projects"
        - "{{ iac_output_dir }}/inventories"
        - "{{ iac_output_dir }}/job_templates"
        - "{{ iac_output_dir }}/workflows"
        - "{{ iac_output_dir }}/notification_templates"

  tasks:
    # Organizations
    - name: Pull organizations from AAP Controller
      awx.awx.controller_organization:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item }}"
      register: org_results
      loop: "{{ query('awx.awx.controller_api', 'organizations', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export organizations to YAML
      copy:
        content: "{{ org_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/organizations/organizations_{{ timestamp }}.yml"
      when: org_results is defined

    # Users
    - name: Pull users from AAP Controller
      user:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        username: "{{ item.username }}"
      register: user_results
      loop: "{{ query('awx.awx.controller_api', 'users', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export users to YAML
      copy:
        content: "{{ user_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/users/users_{{ timestamp }}.yml"
      when: user_results is defined

    # Teams
    - name: Pull teams from AAP Controller
      team:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
      register: team_results
      loop: "{{ query('awx.awx.controller_api', 'teams', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export teams to YAML
      copy:
        content: "{{ team_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/teams/teams_{{ timestamp }}.yml"
      when: team_results is defined

    # Credentials (without sensitive data)
    - name: Pull credentials metadata from AAP Controller
      set_fact:
        credentials_list: "{{ query('awx.awx.controller_api', 'credentials', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"

    - name: Export credential metadata to YAML
      copy:
        content: |
          ---
          # Credentials (sensitive data excluded)
          # Re-create credentials with sensitive values in a secure manner
          {{ credentials_list | to_nice_yaml }}
        dest: "{{ iac_output_dir }}/credentials/credentials_metadata_{{ timestamp }}.yml"
      when: credentials_list is defined

    # Projects
    - name: Pull projects from AAP Controller
      project:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        scm_type: "{{ item.scm_type | default('') }}"
        scm_url: "{{ item.scm_url | default('') }}"
      register: project_results
      loop: "{{ query('awx.awx.controller_api', 'projects', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export projects to YAML
      copy:
        content: "{{ project_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/projects/projects_{{ timestamp }}.yml"
      when: project_results is defined

    # Inventories
    - name: Pull inventories from AAP Controller
      inventory:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
      register: inventory_results
      loop: "{{ query('awx.awx.controller_api', 'inventories', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export inventories to YAML
      copy:
        content: "{{ inventory_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/inventories/inventories_{{ timestamp }}.yml"
      when: inventory_results is defined

    # Job Templates
    - name: Pull job templates from AAP Controller
      job_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
      register: job_template_results
      loop: "{{ query('awx.awx.controller_api', 'job_templates', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export job templates to YAML
      copy:
        content: "{{ job_template_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/job_templates/job_templates_{{ timestamp }}.yml"
      when: job_template_results is defined

    # Workflows
    - name: Pull workflow templates from AAP Controller
      workflow_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
      register: workflow_results
      loop: "{{ query('awx.awx.controller_api', 'workflow_templates', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export workflow templates to YAML
      copy:
        content: "{{ workflow_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/workflows/workflows_{{ timestamp }}.yml"
      when: workflow_results is defined

    # Notification Templates
    - name: Pull notification templates from AAP Controller
      notification_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_controller_validate_certs }}"
        state: present
        name: "{{ item.name }}"
      register: notification_results
      loop: "{{ query('awx.awx.controller_api', 'notification_templates', host=aap_controller_host, username=aap_controller_username, password=aap_controller_password, verify_ssl=aap_controller_validate_certs) }}"
      ignore_errors: true

    - name: Export notification templates to YAML
      copy:
        content: "{{ notification_results | to_nice_yaml }}"
        dest: "{{ iac_output_dir }}/notification_templates/notifications_{{ timestamp }}.yml"
      when: notification_results is defined

  post_tasks:
    - name: Create summary report
      copy:
        content: |
          # AAP Resource Export Summary
          Generated: {{ ansible_date_time.iso8601 }}
          Controller: {{ aap_controller_host }}
          
          ## Exported Resources
          - Organizations: {{ org_results.results | length | default(0) }}
          - Users: {{ user_results.results | length | default(0) }}
          - Teams: {{ team_results.results | length | default(0) }}
          - Credentials: {{ credentials_list | length | default(0) }}
          - Projects: {{ project_results.results | length | default(0) }}
          - Inventories: {{ inventory_results.results | length | default(0) }}
          - Job Templates: {{ job_template_results.results | length | default(0) }}
          - Workflow Templates: {{ workflow_results.results | length | default(0) }}
          - Notification Templates: {{ notification_results.results | length | default(0) }}
          
          ## Location
          Export directory: {{ iac_output_dir }}
          
          ## Notes
          - Sensitive credential data (passwords, API tokens) is not exported for security
          - Credentials must be re-created with sensitive values in a secure manner
          - Review and commit exported files to version control
        dest: "{{ iac_output_dir }}/EXPORT_SUMMARY_{{ timestamp }}.md"

    - name: Display export summary
      debug:
        msg: "AAP resources exported to {{ iac_output_dir }}"
